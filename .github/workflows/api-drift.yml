name: API drift

# Is api/orbit-server.openapi.yaml still identical to api/openapi.yaml on orbit-server main?
# On pull requests it only warns; on the weekly schedule and manual runs it fails.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/pull-openapi.mjs main
      - name: Compare with the committed snapshot
        env:
          LEVEL: ${{ github.event_name == 'pull_request' && 'warning' || 'error' }}
          MESSAGE: orbit-server API changed — run `pnpm api:pull` and commit the snapshot
        run: |
          if ! git diff --exit-code api/; then
            echo "::$LEVEL file=api/orbit-server.openapi.yaml::$MESSAGE"
            echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
